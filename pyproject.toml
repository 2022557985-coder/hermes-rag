[tool.poetry]
name = "hermes-rag"
version = "1.0.0"
description = "Hermes-RAG: A lightweight, high-precision RAG retrieval optimization framework for local deployment"
authors = ["Hermes-RAG Team"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/hermes-rag/hermes-rag"
keywords = ["rag", "retrieval", "information-retrieval", "nlp", "llm", "local"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
python-pptx = "^0.6.23"
beautifulsoup4 = "^4.12.0"
requests = "^2.31.0"
sentence-transformers = "^2.7.0"
chromadb = "^0.4.24"
rank-bm25 = "^0.2.2"
jieba = "^0.42.1"
nltk = "^3.8.0"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
gradio = "^4.31.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
pyyaml = "^6.0.1"
onnxruntime = "^1.18.0"
charset-normalizer = "^3.3.0"
torch = ">=2.0.0"
transformers = "^4.40.0"
numpy = "^1.26.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
black = "^24.4.0"
ruff = "^0.4.0"
locust = "^2.27.0"

[tool.poetry.scripts]
hermes = "hermes_rag.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]